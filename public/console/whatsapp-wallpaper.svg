<?xml version="1.0" encoding="UTF-8"?>
<!--
  Chat wallpaper for the console's WhatsApp conversation view: scattered
  doodles, drawn by hand (no AI image generation involved), in the spirit
  of WhatsApp's own background so a thread reads as a chat rather than as
  another console panel. Stroke-only and deliberately low contrast, so
  message bubbles stay the thing you actually look at.

  Only eleven shapes per tile, each at its own angle and size. The CSS
  (.whatsapp-wallpaper in globals.css) paints this file twice at two
  different sizes and offsets: a single tiling of a neat set of doodles
  reads as a lattice, and two tilings whose periods do not divide each
  other never line up, which is what makes the scatter look random.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <g fill="none" stroke="#b4cbac" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">

    <!-- speech bubble -->
    <g transform="translate(24,30) rotate(-13)">
      <path d="M0 5a5 5 0 0 1 5-5h22a5 5 0 0 1 5 5v12a5 5 0 0 1-5 5H12l-7 6v-6H5a5 5 0 0 1-5-5Z"/>
    </g>

    <!-- heart -->
    <g transform="translate(128,18) rotate(16) scale(0.92)">
      <path d="M11 20S0 13.6 0 6.8A6.3 6.3 0 0 1 11 2.6 6.3 6.3 0 0 1 22 6.8C22 13.6 11 20 11 20Z"/>
    </g>

    <!-- music note -->
    <g transform="translate(246,34) rotate(-9)">
      <path d="M8 21V3l14-2.4V18"/>
      <ellipse cx="4.5" cy="21" rx="4.5" ry="3.4"/>
      <ellipse cx="18.5" cy="18" rx="4.5" ry="3.4"/>
    </g>

    <!-- camera -->
    <g transform="translate(60,112) rotate(7) scale(0.95)">
      <path d="M0 6a3 3 0 0 1 3-3h4l2.5-3.5h9L21 3h4a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H3a3 3 0 0 1-3-3Z"/>
      <circle cx="14" cy="12" r="5"/>
    </g>

    <!-- paper plane -->
    <g transform="translate(176,96) rotate(-18)">
      <path d="M26 0 0 11l10 4 3 10 5-8 8 4Z"/>
      <path d="m10 15 16-15"/>
    </g>

    <!-- clock -->
    <g transform="translate(272,140) rotate(11) scale(0.9)">
      <circle cx="11" cy="11" r="11"/>
      <path d="M11 5v6.5l4 2.5"/>
    </g>

    <!-- lightbulb -->
    <g transform="translate(22,196) rotate(-6)">
      <path d="M9 19a9 9 0 1 1 6 0"/>
      <path d="M8.5 19h7M9.5 23h5"/>
    </g>

    <!-- envelope -->
    <g transform="translate(120,176) rotate(13) scale(0.95)">
      <rect x="0" y="0" width="28" height="19" rx="2.5"/>
      <path d="m1 2 13 9L27 2"/>
    </g>

    <!-- smiley -->
    <g transform="translate(208,214) rotate(-8) scale(0.9)">
      <circle cx="12" cy="12" r="12"/>
      <path d="M6.5 14.5a7 7 0 0 0 11 0"/>
      <path d="M8 8.5v1.5M16 8.5v1.5"/>
    </g>

    <!-- star -->
    <g transform="translate(78,264) rotate(17) scale(0.95)">
      <path d="m11 0 3.4 7 7.6 1-5.5 5.4 1.3 7.6L11 17.4 4.2 21l1.3-7.6L0 8l7.6-1Z"/>
    </g>

    <!-- coffee cup -->
    <g transform="translate(252,272) rotate(-11) scale(0.92)">
      <path d="M1 3h20v10a7 7 0 0 1-7 7H8a7 7 0 0 1-7-7Z"/>
      <path d="M21 6h3a4 4 0 0 1 0 8h-3"/>
      <path d="M0 24h24"/>
    </g>

  </g>
</svg>
