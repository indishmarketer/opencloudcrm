<svg xmlns="http://www.w3.org/2000/svg" width="200" height="56" viewBox="0 0 200 56" role="img" aria-label="Featured on Indish Marketer">
  <title>Featured on Indish Marketer</title>
  <!-- Light variant, for sites with a dark background. Same geometry as the
       dark one so a site can swap between them without the layout moving. -->
  <rect x="0.5" y="0.5" width="199" height="55" rx="12" fill="#ffffff" stroke="#e2e2e0"/>
  <g transform="translate(14 14)">
    <rect width="28" height="28" rx="8" fill="#0a0a0a"/>
    <path d="M8 20V8M14 20v-7M20 20v-4" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="20" cy="9" r="2.6" fill="#d4211f"/>
  </g>
  <text x="54" y="24" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" letter-spacing="1.4" fill="#6b6b6b">FEATURED ON</text>
  <text x="54" y="41" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0a0a0a">Indish Marketer</text>
</svg>
