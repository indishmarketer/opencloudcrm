# One-click self-host stack: the web app and Postgres, wired together.
# See README.md's Deployment section first -- especially what the
# prebuilt image below does and doesn't bake in.
#
# The app image is pulled prebuilt from GitHub Container Registry (built
# by .github/workflows/docker-publish.yml on GitHub's own runners) instead
# of being built on whatever machine runs `docker compose up`. Building
# this app locally needs several GB of RAM; pulling a prebuilt image needs
# a few hundred MB, so this works the same on a minimal VPS as on a
# powerful one.
#
# In Coolify: New Resource -> Docker Compose, point it at this repo, and
# it will create both resources below in one project instead of the
# single "Public Repository" app you get from the Dockerfile alone.
#
# Everywhere else (plain `docker compose up`, Railway, a raw VPS): set the
# variables below (a .env file next to this one works for plain Compose)
# and run it directly.

services:
  app:
    image: ghcr.io/indishmarketer/opencloudcrm:latest
    # Without this, "docker compose up" (what Coolify's redeploy/instant
    # deploy runs) only pulls :latest when nothing with that tag is cached
    # locally yet -- every later redeploy silently keeps running whatever
    # was first pulled, even after a new image publishes, with no error
    # surfaced anywhere. Confirmed on a live deployment: three straight
    # "successful" redeploys after real code fixes, container recreated
    # fresh each time, old image's behavior every time.
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      # Required -- see README.md's Deployment section.
      DATABASE_URL: postgres://opencloudcrm:${DB_PASSWORD:?set a DB_PASSWORD}@db:5432/opencloudcrm
      SESSION_SECRET: ${SESSION_SECRET:?set a long random SESSION_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL -- whoever logs in with this address becomes the console owner}

      # Everything below is optional -- every integration quietly turns
      # itself off if its own vars aren't set (src/config/features.ts).
      # Full documentation for each one lives in .env.example; this list
      # exists so Coolify (or any compose-reading UI) surfaces all of
      # them as fillable fields instead of only whichever few happened to
      # be hardcoded here.

      # --- Identity / email (console login needs one of SES or Brevo --
      # see README.md if you're locked out of a fresh deploy) ---
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      SES_REGION: ${SES_REGION:-}
      SES_ACCESS_KEY_ID: ${SES_ACCESS_KEY_ID:-}
      SES_SECRET_ACCESS_KEY: ${SES_SECRET_ACCESS_KEY:-}
      SES_SNS_WEBHOOK_SECRET: ${SES_SNS_WEBHOOK_SECRET:-}
      SES_SNS_TOPIC_ARN: ${SES_SNS_TOPIC_ARN:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAGIC_LINK_IP_RATE_LIMIT: ${MAGIC_LINK_IP_RATE_LIMIT:-}
      MAGIC_LINK_EMAIL_RATE_LIMIT: ${MAGIC_LINK_EMAIL_RATE_LIMIT:-}

      # --- Turnstile (bot protection) ---
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}

      # --- Brand (NEXT_PUBLIC_* only take effect in an image you build
      # yourself -- inlined at build time, which this prebuilt image
      # skips, into next.config.ts's own output as well as the app code.
      # Harmless to set anyway. ASSET_DOMAIN below (no NEXT_PUBLIC_
      # prefix, so never inlined) is what actually controls image loading
      # on this prebuilt image -- see .env.example.) ---
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
      NEXT_PUBLIC_ASSET_DOMAIN: ${NEXT_PUBLIC_ASSET_DOMAIN:-}
      ASSET_DOMAIN: ${ASSET_DOMAIN:-}

      # --- Single sign-on (src/lib/sso.ts) ---
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}

      # --- Payments ---
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_ENV: ${PAYPAL_ENV:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}

      # --- Storage (Cloudflare R2) ---
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_S3_ENDPOINT: ${R2_S3_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      R2_COURSES_BUCKET: ${R2_COURSES_BUCKET:-}
      R2_WHATSAPP_BUCKET: ${R2_WHATSAPP_BUCKET:-}
      R2_BACKUP_BUCKET: ${R2_BACKUP_BUCKET:-}

      # --- Video (Mux) ---
      MUX_TOKEN_ID: ${MUX_TOKEN_ID:-}
      MUX_TOKEN_SECRET: ${MUX_TOKEN_SECRET:-}
      MUX_SIGNING_KEY_ID: ${MUX_SIGNING_KEY_ID:-}
      MUX_SIGNING_KEY_PRIVATE: ${MUX_SIGNING_KEY_PRIVATE:-}
      MUX_WEBHOOK_SECRET: ${MUX_WEBHOOK_SECRET:-}
      MUX_WEBHOOK_SIGNING_SECRET: ${MUX_WEBHOOK_SIGNING_SECRET:-}

      # --- Cal.com (meetings) ---
      CALCOM_API_KEY: ${CALCOM_API_KEY:-}
      CALCOM_WEBHOOK_SECRET: ${CALCOM_WEBHOOK_SECRET:-}

      # --- Google Business Profile ---
      GOOGLE_BUSINESS_CLIENT_ID: ${GOOGLE_BUSINESS_CLIENT_ID:-}
      GOOGLE_BUSINESS_CLIENT_SECRET: ${GOOGLE_BUSINESS_CLIENT_SECRET:-}
      GOOGLE_BUSINESS_REDIRECT_URI: ${GOOGLE_BUSINESS_REDIRECT_URI:-}
      GOOGLE_BUSINESS_PUBSUB_TOPIC: ${GOOGLE_BUSINESS_PUBSUB_TOPIC:-}
      GOOGLE_BUSINESS_PUBSUB_SERVICE_ACCOUNT: ${GOOGLE_BUSINESS_PUBSUB_SERVICE_ACCOUNT:-}
      GOOGLE_BUSINESS_PUBSUB_AUDIENCE: ${GOOGLE_BUSINESS_PUBSUB_AUDIENCE:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}

      # --- WhatsApp ---
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_WABA_ID: ${WHATSAPP_WABA_ID:-}
      WHATSAPP_APP_ID: ${WHATSAPP_APP_ID:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_MEDIA_RETENTION_DAYS: ${WHATSAPP_MEDIA_RETENTION_DAYS:-}

      # --- AI image generation ---
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-}
      POLLINATIONS_API_KEY: ${POLLINATIONS_API_KEY:-}
      POLLINATIONS_IMAGE_MODEL: ${POLLINATIONS_IMAGE_MODEL:-}
      POLLINATIONS_IMAGE_ENDPOINT: ${POLLINATIONS_IMAGE_ENDPOINT:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}

      # --- Analytics / tracking ---
      NEXT_PUBLIC_GA4_MEASUREMENT_ID: ${NEXT_PUBLIC_GA4_MEASUREMENT_ID:-}
      GA4_API_SECRET: ${GA4_API_SECRET:-}
      NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-}
      META_CAPI_ACCESS_TOKEN: ${META_CAPI_ACCESS_TOKEN:-}
      BING_API_KEY: ${BING_API_KEY:-}

      # --- Error tracking (Sentry) ---
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}

      # --- Misc / security ---
      CONSOLE_MFA: ${CONSOLE_MFA:-}
      CRON_SECRET: ${CRON_SECRET:-}
      WEBHOOK_SHARED_SECRET: ${WEBHOOK_SHARED_SECRET:-}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
      CLOUDFLARE_ZONE_TOKEN: ${CLOUDFLARE_ZONE_TOKEN:-}

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencloudcrm"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_USER: opencloudcrm
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set a DB_PASSWORD}
      POSTGRES_DB: opencloudcrm
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
