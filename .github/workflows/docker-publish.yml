name: Build and publish Docker image

# Builds the app once here, on GitHub's runners (free for a public repo),
# instead of asking every self-hoster's own server to run `next build`.
# That build needs several GB of RAM (TypeScript + a large page tree) and
# was the direct cause of deploys failing on modest VPS instances -- see
# the Deployment section of README.md. Self-hosters pull the resulting
# image and never run `npm run build` at all.
#
# This image is built WITHOUT any of the Dockerfile's NEXT_PUBLIC_* build
# args, since those are baked in at build time and a single shared image
# can't carry a different value per deployer's domain. It's a generic,
# unbranded image -- see README.md's Deployment section for exactly what
# that does and doesn't affect, and how to get a fully-branded image of
# your own (still built on GitHub's runners, not your server) by forking
# this repo.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "public/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}

jobs:
  build-app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
