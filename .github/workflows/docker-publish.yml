name: Build and publish Docker image

# Builds the app once here, on GitHub's runners (free for a public repo),
# instead of asking every self-hoster's own server to run `next build`.
# That build needs several GB of RAM (TypeScript + a large page tree) and
# was the direct cause of deploys failing on modest VPS instances -- see
# the Deployment section of README.md. Self-hosters pull the resulting
# image and never run `npm run build` at all.
#
# The Dockerfile's NEXT_PUBLIC_* build args (branding, GA4, Meta Pixel,
# Turnstile) are passed below from this repo's own Actions secrets. On the
# public opencloudcrm repo none of those secrets exist, so they resolve to
# empty strings and the image stays generic/unbranded for other
# self-hosters. A fork (including indishmarketer/indishmarketer-crm, the
# private repo indishmarketer.com actually deploys from) gets a
# fully-branded image automatically once its own repo's Settings ->
# Secrets and variables -> Actions has these same names set.
#
# This matters because Coolify's own env vars are NOT used as build args
# here: indishmarketer.com's Coolify app (build_pack: dockerimage) only
# pulls the prebuilt ghcr.io image this workflow publishes -- it never runs
# `docker build` itself, so anything that must be baked in at build time
# (every NEXT_PUBLIC_* var) has to come from THIS workflow, not from
# Coolify's "buildtime" env var flags, which that build mode never reads.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "public/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}

jobs:
  build-app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_GA4_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_GA4_MEASUREMENT_ID }}
            NEXT_PUBLIC_META_PIXEL_ID=${{ secrets.NEXT_PUBLIC_META_PIXEL_ID }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_SITE_NAME=${{ secrets.NEXT_PUBLIC_SITE_NAME }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_ASSET_DOMAIN=${{ secrets.NEXT_PUBLIC_ASSET_DOMAIN }}
            NEXT_PUBLIC_SOCIAL_FACEBOOK=${{ secrets.NEXT_PUBLIC_SOCIAL_FACEBOOK }}
            NEXT_PUBLIC_SOCIAL_X=${{ secrets.NEXT_PUBLIC_SOCIAL_X }}
            NEXT_PUBLIC_SOCIAL_YOUTUBE=${{ secrets.NEXT_PUBLIC_SOCIAL_YOUTUBE }}
            NEXT_PUBLIC_SOCIAL_LINKEDIN=${{ secrets.NEXT_PUBLIC_SOCIAL_LINKEDIN }}
